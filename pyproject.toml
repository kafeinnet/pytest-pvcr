[project]
name = "pytest-pvcr"
version = "0.2.0"
description = "PyTest Process VCR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fabien Dupont", email = "fab+github@kafe-in.net" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=3.5.0",
    "pyyaml>=6.0.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/kafeinnet/pytest-pvcr"
Issues = "https://github.com/kafeinnet/pytest-pvcr/issues"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[project.entry-points.pytest11]
pvcr = "pytest_pvcr.plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pytest_pvcr"]

[tool.coverage.report]
show_missing = true
fail_under = 65
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.ruff]
target-version = "py312"
src = ["src"]
# Allow lines to be as long as 120.
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404"]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "pytest-cov>=7.0.0",
]
