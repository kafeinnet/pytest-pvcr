[project]
name = "pytest-pvcr"
version = "0.1.2"
description = "PyTest Process VCR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Fabien Dupont", email = "fab+github@kafe-in.net" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=3.5.0",
    "pyyaml>=6.0.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/kafeinnet/pytest-pvcr"
Issues = "https://github.com/kafeinnet/pytest-pvcr/issues"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[project.entry-points.pytest11]
pvcr = "pytest_pvcr.plugin"
